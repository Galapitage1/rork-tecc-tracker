name: Build and Package App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build web app
        run: bunx expo export -p web
      
      - name: Copy PHP sync files
        run: |
          mkdir -p dist/Tracker/api
          mkdir -p dist/Tracker/data
          cp public/Tracker/api/sync.php dist/Tracker/api/
          cp public/Tracker/api/get.php dist/Tracker/api/
          cp public/Tracker/api/.htaccess dist/Tracker/api/
          cp public/Tracker/data/.htaccess dist/Tracker/data/
          touch dist/Tracker/data/.gitkeep
      
      - name: Copy root .htaccess
        run: cp .htaccess dist/.htaccess || cp htaccess dist/.htaccess || echo "No .htaccess found"
      
      - name: Create deployment package
        run: |
          cd dist
          zip -r ../tracker-app.zip .
          cd ..
      
